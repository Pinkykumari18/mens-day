<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0907">
  <meta name="robots" content="noindex, nofollow">
  <title>Happy Men's Day</title>
  <meta property="og:title" content="A special wish is waiting for you">
  <meta property="og:description" content="Happy International Men's Day!">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Great+Vibes&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>

  <main id="app">
    <!-- Intro animation is injected here by script.js -->
    <section id="scene" class="scene" aria-live="polite"></section>

    <!-- Final photo + wish card -->
    <section id="reveal" class="reveal" hidden>
      <article class="card" id="card">
        <div class="bowtie" data-a style="--i:0" aria-hidden="true">
          <svg viewBox="0 0 64 46" width="64" height="46">
            <defs>
              <linearGradient id="gc" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#e8cf8f"/><stop offset="0.5" stop-color="#a67c37"/><stop offset="1" stop-color="#7a5a22"/>
              </linearGradient>
            </defs>
            <path d="M29 23 L4 9 Q2 8 2 11 L2 35 Q2 38 4 37 L29 23 Z" fill="url(#gc)"/>
            <path d="M35 23 L60 9 Q62 8 62 11 L62 35 Q62 38 60 37 L35 23 Z" fill="url(#gc)"/>
            <rect x="26" y="14" width="12" height="18" rx="4" fill="#7a5a22"/>
            <rect x="29" y="17" width="2" height="12" rx="1" fill="#ecd596" opacity=".8"/>
          </svg>
        </div>

        <div class="photo-wrap" data-a style="--i:1">
          <img id="photo" alt="" hidden>
          <div id="initials" hidden></div>
        </div>

        <p class="eyebrow" id="eyebrow" data-a style="--i:2"></p>
        <h1 id="name" data-a style="--i:3"></h1>
        <span class="tag" id="tag" data-a style="--i:4"></span>
        <div class="divider" data-a style="--i:5"><i></i><b></b><i></i></div>
        <p class="wish" id="wish"></p>
        <p class="sig" data-a style="--i:6"><span id="from"></span><span class="dot">&#10022;</span><span id="date"></span></p>
      </article>

      <div class="actions" data-a style="--i:8">
        <button class="btn" id="b-save" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>
          Save card
        </button>
      </div>
    </section>

    <!-- Shown when the QR link has no / wrong id -->
    <section id="missing" class="missing" hidden>
      <h2>Oops, this link is incomplete</h2>
      <p>Please scan your own QR code again.</p>
      <a class="btn" id="demo-link" href="?id=01">See a demo</a>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
